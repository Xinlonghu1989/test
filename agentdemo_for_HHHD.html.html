<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agent 実行モニター</title>
<style>
/* ══ 色は3つだけに意味を持たせる ══════════════
   青 = 進行中 / 赤 = 事件（軌道修正・権限の壁）/ 緑 = 達成
   ── 大画面での投影を前提に、全体を約1.7倍のスケールで組む ── */
:root{
  --bg:#07090e; --bg2:#0b0e15; --panel:#0f131c; --hd:#0c1017;
  --line:#1c2231; --line2:#2a3245;
  --tx:#e6ebf5; --tx2:#96a1b6; --tx3:#5d6880;
  --go:#5b93ff; --hit:#ff5d68; --ok:#35c98a;
  --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  /* ── 文字スケール（ここを触れば全体が連動する）── */
  --f-narr:22px; --f-chat:20px; --f-think:18.5px; --f-mile:19.5px;
  --f-plan:18px; --f-tool:15px; --f-evid:16px; --f-hd:14px;
  --col-chat:480px; --col-rail:400px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);overflow:hidden;font-size:18px;line-height:1.65;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#252e42;border-radius:11px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.app{height:100vh;display:flex;flex-direction:column}

/* ── ヘッダ ─────────────────────────── */
.top{display:flex;align-items:center;gap:18px;padding:0 22px;height:56px;flex:none;
  background:#0a0d14;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;white-space:nowrap}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 11px var(--ok)}
.brand small{font-weight:400;color:var(--tx3);font-size:14px}
.tabs{display:flex;gap:8px;margin-left:auto}
.tab{padding:7px 17px;border-radius:8px;border:1px solid var(--line);background:#0d111a;
  color:var(--tx3);cursor:pointer;font-size:15.5px;font-family:inherit;transition:.15s;white-space:nowrap}
.tab:hover{color:var(--tx2)}
.tab.on{background:#16264a;border-color:#3a5da8;color:#cfe0ff}

/* ── 実況ライン（背景色なし・静か）───── */
.stage{flex:none;display:flex;align-items:center;gap:24px;padding:12px 22px;
  background:#0a0d14;border-bottom:1px solid var(--line2)}
.narr{display:flex;align-items:center;gap:15px;flex:1;min-width:0}
.narr .ic{font-size:20px;width:25px;text-align:center;color:var(--tx3);flex:none;transition:color .3s}
.narr .tx{font-size:var(--f-narr);color:var(--tx2);line-height:1.35;transition:color .3s;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.narr.hit .ic,.narr.hit .tx{color:#ff8f97}
.narr.wait .ic,.narr.wait .tx{color:#9fc0ff}
.narr.good .ic,.narr.good .tx{color:#7fdcb4}
.phdots{display:flex;align-items:center;gap:7px;flex:none}
.phdots i{width:7px;height:7px;border-radius:50%;background:#222a3c;transition:.3s;font-style:normal}
.phdots i.on{background:var(--go);transform:scale(1.5)}
.phdots b{font-family:var(--mono);font-size:13px;color:var(--tx3);font-weight:500;
  letter-spacing:.09em;margin-left:9px;min-width:82px}
.mets{display:flex;gap:24px;align-items:center;padding-left:24px;flex:none;border-left:1px solid var(--line)}
.met{text-align:right;line-height:1.2;opacity:.72}
.met b{display:block;font-family:var(--mono);font-size:19px;color:var(--tx2);font-weight:600}
.met span{font-size:11.5px;color:var(--tx3)}
.met.fix{opacity:1} .met.fix b{color:var(--hit)}

/* ── 3カラム：チャット｜思考｜右レール ── */
.main{flex:1;min-height:0;display:grid;gap:1px;background:var(--line);
  grid-template-columns:var(--col-chat) 1fr var(--col-rail)}

/* ── チャット ───────────────────────── */
.chat{background:var(--bg2);display:flex;flex-direction:column;min-height:0;
  box-shadow:inset 4px 0 0 -1px rgba(91,147,255,.3)}
.chat-hd{padding:14px 20px;border-bottom:1px solid var(--line);flex:none;display:flex;align-items:center;gap:13px}
.avatar{width:34px;height:34px;border-radius:10px;flex:none;background:linear-gradient(135deg,#4f86f7,#7b6ef0);
  display:grid;place-items:center;font-size:14px;font-weight:700;color:#fff}
.chat-hd b{font-size:16.5px}
.chat-hd em{font-style:normal;color:var(--tx3);font-size:14px;display:block;line-height:1.35}
.chat-body{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:18px;min-height:0}
.msg{display:flex;gap:12px;animation:fadeUp .35s ease}
.msg .ic{width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;
  font-size:12px;font-weight:700;margin-top:3px}
.msg.user{flex-direction:row-reverse}
.msg.user .ic{background:#232c40;color:#93a3bf}
.msg.agent .ic{background:linear-gradient(135deg,#4f86f7,#7b6ef0);color:#fff}
.bub{max-width:calc(100% - 42px);padding:13px 17px;border-radius:14px;font-size:var(--f-chat);
  line-height:1.78;white-space:pre-wrap;word-break:break-word}
.msg.user .bub{background:#1e3a68;border:1px solid #2d5088;border-bottom-right-radius:5px}
.msg.agent .bub{background:#141a26;border:1px solid var(--line2);border-bottom-left-radius:5px}
.bub b{color:#fff}
.bub .hl{color:#ffd479}
.bub hr{border:0;border-top:1px solid #2a3245;margin:13px 0}
.typing{display:flex;gap:6px;padding:18px 20px}
.typing i{width:9px;height:9px;border-radius:50%;background:var(--tx3);animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.compose{border-top:1px solid var(--line);padding:16px 18px;flex:none;background:#080b11}
.cwrap{display:flex;gap:11px;align-items:flex-end}
.cbox{flex:1;background:#111725;border:1px solid var(--line2);border-radius:11px;padding:12px 15px;
  font-size:18px;color:var(--tx);min-height:48px;max-height:200px;overflow-y:auto;white-space:pre-wrap;line-height:1.7}
.cbox.empty{color:var(--tx3)}
.cbox.armed{border-color:#4b7ad4;box-shadow:0 0 0 4px rgba(91,147,255,.13)}
.send{width:48px;height:48px;flex:none;border-radius:11px;border:0;cursor:pointer;background:#2b58a8;
  color:#fff;font-size:19px;display:grid;place-items:center;transition:.15s}
.send:hover:not(:disabled){background:#356ad0}
.send:disabled{background:#161d2a;color:#414c62;cursor:default}
.await-tag{font-size:14.5px;color:#9fc0ff;margin-bottom:10px;display:flex;align-items:center;gap:9px}
.await-tag .pulse{width:9px;height:9px;border-radius:50%;background:var(--go);animation:pg 1.4s infinite}
@keyframes pg{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(91,147,255,.45)}50%{opacity:.45;box-shadow:0 0 0 10px rgba(91,147,255,0)}}

/* ── パネル共通 ─────────────────────── */
.rail{display:flex;flex-direction:column;gap:1px;background:var(--line);min-height:0}
.rail .panel:nth-child(1){flex:1.15 1 0}
.rail .panel:nth-child(2){flex:1 1 0}
.panel{background:var(--panel);display:flex;flex-direction:column;min-height:0;overflow:hidden;
  transition:opacity .5s,filter .5s}
.panel.t1{box-shadow:inset 0 3px 0 0 rgba(91,147,255,.35)}
.panel.t2{opacity:.96}
.panel.t3{opacity:.5;filter:saturate(.2)}
.panel.hot{opacity:1;filter:none}
.p-hd{flex:none;padding:10px 15px;border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:11px;background:var(--hd)}
.p-hd h3{margin:0;font-size:var(--f-hd);letter-spacing:.05em;color:var(--tx2);font-weight:600}
.p-hd .sub{font-size:12px;color:#3c465c}
.p-hd .cnt{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--tx3);
  background:#141a27;border:1px solid var(--line);padding:2px 11px;border-radius:20px}
.p-bd{flex:1;overflow-y:auto;padding:13px;min-height:0;display:flex;flex-direction:column;gap:9px}
.p-bd[hidden]{display:none}
.empty-note{color:#333c4e;font-size:15px;text-align:center;padding:28px 10px;line-height:1.7}
.p-bd.dim > *:not(:last-child){opacity:.38}
.p-bd.dim > .th.correct,.p-bd.dim > .mile,.p-bd.dim > .gd.block{opacity:1}

/* ── タスクプラン ───────────────────── */
.tk{display:flex;gap:12px;padding:11px 13px;border-radius:10px;border:1px solid transparent;
  background:#141a26;font-size:var(--f-plan);animation:fadeUp .3s ease;transition:.25s;align-items:flex-start}
.tk.sub{margin-left:22px;background:#111621;font-size:calc(var(--f-plan) - 2px)}
.tk .bx{width:19px;height:19px;border-radius:5px;border:2px solid #303950;flex:none;margin-top:3px;
  display:grid;place-items:center;font-size:12px;color:#0a0d14;font-weight:700;transition:.2s}
.tk .lb{flex:1;color:var(--tx2);line-height:1.5}
.tk.run{border-color:#3a5da8;background:#16223c}
.tk.run .bx{border-color:var(--go)}
.tk.run .bx::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--go);animation:pg 1.2s infinite}
.tk.run .lb{color:#dbe8ff;font-weight:600}
.tk.done .bx{background:var(--ok);border-color:var(--ok)}
.tk.done .bx::after{content:"✓"}
.tk.done .lb{color:#4d566c;text-decoration:line-through;text-decoration-color:#2f3852}
.tk.warnst .bx{background:var(--hit);border-color:var(--hit)}
.tk.warnst .bx::after{content:"!"}
.tk.warnst .lb{color:#f0b3b8}
.tk.newly{animation:pop .7s ease}
.tk .tag{font-size:12px;font-family:var(--mono);padding:2px 8px;border-radius:6px;margin-top:3px;
  background:rgba(255,93,104,.13);color:#ff9098;border:1px solid rgba(255,93,104,.3);white-space:nowrap}

/* ── 思考ストリーム ─────────────────── */
.th{border-left:3px solid #2a3245;padding:10px 15px;background:#131924;border-radius:0 10px 10px 0;
  animation:fadeUp .35s ease;font-size:var(--f-think);cursor:pointer;transition:opacity .5s}
.th .k{font-size:13px;font-family:var(--mono);letter-spacing:.08em;color:var(--tx3);display:block;margin-bottom:5px}
.th p{margin:0;color:var(--tx2);line-height:1.72}
.p-bd.dim .th:not(:last-child):not(.open):not(.correct) p{
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.th.decide{border-left-color:#3c4d75} .th.decide .k{color:#7e93bd}
.th.correct{border-left:4px solid var(--hit);border-top:1px solid rgba(255,93,104,.28);
  border-right:1px solid rgba(255,93,104,.28);border-bottom:1px solid rgba(255,93,104,.28);
  background:linear-gradient(90deg,rgba(255,93,104,.13),#131924 72%)}
.th.correct .k{color:var(--hit);font-weight:700}
.th.correct p{color:#ffd0d3}

/* ── 達成マイルストーン ─────────────── */
.mile{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border-radius:11px;
  border:1px solid rgba(53,201,138,.32);background:rgba(53,201,138,.085);
  animation:mpop .6s ease;transition:opacity .5s}
.mile .mi{color:var(--ok);font-size:19px;flex:none;line-height:1.25}
.mile b{display:block;font-size:13px;font-family:var(--mono);color:var(--ok);
  letter-spacing:.1em;margin-bottom:4px;font-weight:700}
.mile p{margin:0;font-size:var(--f-mile);color:#c9e9da;line-height:1.62;font-weight:600}
@keyframes mpop{0%{opacity:0;transform:translateY(8px)}60%{box-shadow:0 0 0 10px rgba(53,201,138,.11)}
  100%{opacity:1;transform:none;box-shadow:0 0 0 0 rgba(53,201,138,0)}}

/* ── 証拠パネル（3タブを1枠に集約）──── */
.evtabs{gap:0;padding:0 8px}
.evtab{flex:1;min-width:0;border:0;background:transparent;color:var(--tx3);cursor:pointer;font-family:inherit;
  font-size:13px;padding:11px 2px;border-bottom:2px solid transparent;transition:.2s;white-space:nowrap;
  display:flex;align-items:center;justify-content:center;gap:7px}
.evtab:hover{color:var(--tx2)}
.evtab.on{color:#bcd4ff;border-bottom-color:var(--go)}
.evtab i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--tx3);flex:none;
  background:#141a27;border:1px solid var(--line);padding:1px 7px;border-radius:20px}
.evtab.on i{color:#9fc0ff;border-color:#2c3d63}

/* ── ツールログ ─────────────────────── */
.tl{background:#131924;border:1px solid var(--line);border-radius:9px;padding:9px 13px;
  font-family:var(--mono);font-size:var(--f-tool);animation:fadeUp .3s ease;transition:opacity .5s}
.tl .l1{display:flex;align-items:center;gap:10px}
.tl .nm{color:#95b4e8;font-weight:600}
.tl .more{color:#3c465c;cursor:pointer;padding:0 4px}
.tl .more:hover{color:var(--tx2)}
.tl .ag{display:none;color:var(--tx3);font-size:13px;margin-top:6px;word-break:break-all}
.tl.open .ag{display:block}
.tl .st{margin-left:auto;font-size:13px;white-space:nowrap;color:var(--tx3)}
.tl .rs{margin-top:8px;padding-top:8px;border-top:1px dashed #222a3a;color:var(--tx2);font-size:var(--f-tool);
  line-height:1.6;white-space:pre-wrap;font-family:inherit;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tl.open .rs{-webkit-line-clamp:unset;display:block}
.tl.running{border-color:#3a5da8} .tl.running .st{color:var(--go)}
.tl.ok .st{color:#4c6a58}
.tl.warn{border-color:rgba(255,93,104,.28)} .tl.warn .st{color:var(--hit)}
.tl.err{border-color:rgba(255,93,104,.45);background:#1a1119} .tl.err .st{color:var(--hit)}
.sp{width:11px;height:11px;border:2px solid #252d40;border-top-color:var(--go);border-radius:50%;
  display:inline-block;animation:spin .65s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.par{border:1px dashed #3a5da8;border-radius:10px;padding:11px;background:#0e1524;animation:fadeUp .3s ease}
.par-hd{font-size:13px;font-family:var(--mono);color:var(--go);letter-spacing:.05em;margin-bottom:10px;
  display:flex;align-items:center;gap:9px}
.lanes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.lane{background:#131924;border:1px solid var(--line);border-radius:8px;padding:8px;min-height:62px}
.lane h5{margin:0 0 6px;font-size:12px;color:#95b4e8;font-family:var(--mono);font-weight:600;line-height:1.35}
.lane .li{font-size:11.5px;font-family:var(--mono);color:var(--tx3);margin-bottom:5px;line-height:1.5;
  animation:fadeUp .3s ease}
.lane .li b{color:var(--tx2);font-weight:500}
.lane .li.done{color:#4c6a58}

/* ── 獲得コンテキスト ───────────────── */
.ft{background:#131924;border:1px solid var(--line);border-left:3px solid #2a3245;border-radius:0 9px 9px 0;
  padding:10px 14px;animation:fadeUp .3s ease;transition:opacity .5s}
.ft h6{margin:0 0 4px;font-size:12px;color:var(--tx3);font-family:var(--mono);letter-spacing:.05em;font-weight:600}
.ft p{margin:0;font-size:var(--f-evid);color:var(--tx2);line-height:1.62}
.ft.key{border-left-color:var(--ok)} .ft.key h6{color:var(--ok)}
.ft.rev{border-left-color:var(--hit)} .ft.rev h6{color:var(--hit)}
.ft.rev p{text-decoration:line-through;color:var(--tx3);opacity:.7}

/* ── ガードレール ───────────────────── */
.gd{border-radius:9px;padding:10px 14px;font-size:var(--f-evid);display:flex;gap:11px;border:1px solid var(--line);
  background:#131924;animation:fadeUp .3s ease;line-height:1.62;color:var(--tx2);transition:opacity .5s}
.gd .gi{flex:none;font-size:16px;line-height:1.4}
.gd.block{border-color:rgba(255,93,104,.4);background:rgba(255,93,104,.09);color:#ffc9cd}
.gd.warn{border-color:rgba(255,93,104,.22);color:#e0b6ba}
.gd.ok{border-color:rgba(53,201,138,.3);background:rgba(53,201,138,.07);color:#a8ebcd}

@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.96);background:#1e3a68}100%{transform:none}}

/* ── 画面幅への追従 ─────────────────── */
@media(min-width:1900px){
  :root{--col-chat:560px; --col-rail:460px;
    --f-narr:25px; --f-chat:21.5px; --f-think:20px; --f-mile:21px; --f-plan:19px;
    --f-tool:16px; --f-evid:17px; --f-hd:15px}
}
@media(max-width:1400px){
  :root{--col-chat:400px; --col-rail:335px;
    --f-narr:19.5px; --f-chat:17.5px; --f-think:16.5px; --f-mile:17px; --f-plan:16px;
    --f-tool:13px; --f-evid:14px; --f-hd:13px}
  .mets{gap:16px} .met b{font-size:17px}
}
@media(max-width:1240px){
  :root{--col-chat:340px; --col-rail:285px;
    --f-narr:16.5px; --f-chat:15px; --f-think:14px; --f-mile:14.5px; --f-plan:13.5px}
  .phdots{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="dot"></span>Agent 実行モニター
      <small>明和精機株式会社 / 社内業務エージェント</small></div>
    <nav class="tabs" id="tabs"></nav>
  </header>

  <div class="stage">
    <div class="narr" id="narr">
      <span class="ic" id="narrIc">⏸</span>
      <span class="tx" id="narrTx">待機中</span>
    </div>
    <div class="phdots" id="phdots"></div>
    <div class="mets">
      <div class="met"><b id="mTool">0</b><span>ツール実行</span></div>
      <div class="met"><b id="mMile">0</b><span>達成</span></div>
      <div class="met fix"><b id="mFix">0</b><span>軌道修正</span></div>
      <div class="met"><b id="mHum">0</b><span>人間の介入</span></div>
      <div class="met"><b id="mTime">00:00</b><span>経過</span></div>
    </div>
  </div>

  <div class="main">
    <!-- ① 会話 -->
    <section class="chat">
      <div class="chat-hd">
        <div class="avatar">AI</div>
        <div><b id="agName">業務アシスタント Agent</b><em id="agSub">待機中</em></div>
      </div>
      <div class="chat-body" id="chatBody"></div>
      <div class="compose">
        <div class="await-tag" id="awaitTag" style="display:none">
          <span class="pulse"></span><span id="awaitTxt"></span>
        </div>
        <div class="cwrap">
          <div class="cbox" id="cbox"></div>
          <button class="send" id="bSend" title="送信">➤</button>
        </div>
      </div>
    </section>

    <!-- ② 思考（達成・軌道修正はここでハイライト） -->
    <section class="panel t2" id="panThink">
      <div class="p-hd"><h3>思考ストリーム</h3><span class="sub">クリックで全文</span>
        <span class="cnt" id="cThink">0</span></div>
      <div class="p-bd dim" id="pThink"><div class="empty-note">Agent の内部推論と達成ポイント</div></div>
    </section>

    <!-- ③ 右レール：タスクプラン ＋ 証拠 -->
    <div class="rail">
      <div class="panel t1" id="panPlan">
        <div class="p-hd"><h3>タスクプラン</h3><span class="cnt" id="cPlan">0/0</span></div>
        <div class="p-bd" id="pPlan"><div class="empty-note">依頼を送信すると<br>Agent がタスクを分解します</div></div>
      </div>
      <div class="panel t3" id="panEvid">
        <div class="p-hd evtabs">
          <button class="evtab on" data-p="pTool">ツール実行 <i id="cTool">0</i></button>
          <button class="evtab" data-p="pFact">コンテキスト <i id="cFact">0</i></button>
          <button class="evtab" data-p="pGuard">ガードレール <i id="cGuard">0</i></button>
        </div>
        <div class="p-bd dim" id="pTool"><div class="empty-note">外部システムへのアクセス履歴</div></div>
        <div class="p-bd dim" id="pFact" hidden><div class="empty-note">確定した事実</div></div>
        <div class="p-bd dim" id="pGuard" hidden><div class="empty-note">権限境界と安全制御</div></div>
      </div>
    </div>
  </div>
</div>
<script>
/* ══════════════════════════════════════════════════════════
   実行エンジン
     ①チャット ②思考ストリーム（達成＝緑 / 軌道修正＝赤）
     ③右レール：タスクプラン ＋ 証拠（3タブを自動追従で切替）
   操作はキーボードのみ： Space 再生/停止 ・ → 1ステップ ・ R 最初から ・ S 速度
   ══════════════════════════════════════════════════════════ */

const $  = id => document.getElementById(id);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const esc = s => String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const fmt = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/__(.+?)__/g,'<span class="hl">$1</span>').replace(/---/g,'<hr>');

const PHASES = ['PLAN','THINK','ACT','OBSERVE','REFLECT'];
const PHASE_NARR = {
  PLAN:['☰','何をすべきか組み立てています'], THINK:['◇','集めた材料を突き合わせて考えています'],
  ACT:['▶','社内システムにアクセスしています'], OBSERVE:['◎','取得した結果を読んでいます'],
  REFLECT:['✓','自分の判断が正しいか検証しています'], HUMAN:['⏸','あなたの確認を待っています'],
  DONE:['✔','完了しました'],
};
const KIND = {observe:'観察',hypo:'仮説',decide:'判断',verify:'自己検証',
  correct:'軌道修正',plan:'計画',recall:'記憶参照'};
const ICON = {observe:'◎',hypo:'◇',decide:'▶',verify:'✓',correct:'⟲',plan:'☰',recall:'⌘'};
const SPEEDS = [1, 1.6, 2.5, 0.6];
const EVID = {pTool:1, pFact:1, pGuard:1};   // 証拠パネルの3タブ

let S = null;

function newState(scn){
  return {scn, steps:scn.steps.slice(), idx:0, playing:false, awaiting:null, pending:null,
    timer:null, speed:1, tasks:new Map(), lanes:null,
    n:{tool:0,think:0,fact:0,guard:0,fix:0,mile:0,hum:0,ms:0}};
}

function narrate(icon,text,tone){
  $('narrIc').textContent=icon; $('narrTx').textContent=text;
  $('narr').className='narr'+(tone?' '+tone:'');
}
function setPhase(v){
  $('phdots').innerHTML='';
  PHASES.forEach(p=>$('phdots').appendChild(el('i', p===v?'on':'')));
  $('phdots').appendChild(el('b',null, PHASES.includes(v)?v:'—'));
}
function spotlight(panelId){
  const p=$(panelId); if(!p) return;
  p.classList.add('hot'); clearTimeout(p._t);
  p._t=setTimeout(()=>p.classList.remove('hot'), 2600/Math.max(1,S.speed*.6));
}
/* 証拠パネル：書き込みがあったタブへ自動で切り替える */
function showEvid(paneId){
  Object.keys(EVID).forEach(k=>{ $(k).hidden = (k!==paneId); });
  document.querySelectorAll('.evtab').forEach(b=>b.classList.toggle('on', b.dataset.p===paneId));
}
function push(paneId,node,cntId,val){
  const p=$(paneId);
  if(EVID[paneId]){ showEvid(paneId); spotlight('panEvid'); }
  const note=p.querySelector('.empty-note'); if(note) note.remove();
  p.appendChild(node); p.scrollTop=p.scrollHeight;
  if(cntId) $(cntId).textContent=val;
  if(paneId==='pThink') spotlight('panThink');
  return node;
}
function refreshMetrics(){
  $('mTool').textContent=S.n.tool; $('mMile').textContent=S.n.mile;
  $('mFix').textContent=S.n.fix;   $('mHum').textContent=S.n.hum;
  const t=Math.round(S.n.ms/1000);
  $('mTime').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
}
function planCount(){
  let d=0,a=0; S.tasks.forEach(t=>{a++; if(['done','fail','skip'].includes(t.status))d++;});
  $('cPlan').textContent=d+'/'+a;
}

/* ── ステップ実行 ─────────────────────── */
function exec(s){
  switch(s.type){

  case 'phase': {
    setPhase(s.v);
    const [ic,tx]=PHASE_NARR[s.v]||['▶',''];
    narrate(s.narrIc||ic, s.narr||tx, s.tone||(s.v==='HUMAN'?'wait':s.v==='DONE'?'good':''));
    $('agSub').textContent=tx;
    return 950;
  }

  case 'chat': {
    const m=el('div','msg '+s.role);
    m.appendChild(el('div','ic', s.role==='user'?'You':'AI'));
    m.appendChild(el('div','bub', fmt(s.text)));
    push('chatBody', m);
    if(s.role==='agent') narrate('💬','あなたに報告しています','');
    return s.d || Math.min(5800, 1300+s.text.length*21);
  }

  case 'typing': {
    const m=el('div','msg agent'); m.id='typingNode';
    m.appendChild(el('div','ic','AI'));
    m.appendChild(el('div','bub typing','<i></i><i></i><i></i>'));
    push('chatBody', m);
    setTimeout(()=>{const n=$('typingNode'); if(n)n.remove();}, (s.d||1400)/S.speed);
    return s.d||1400;
  }

  case 'plan': return planOp(s);

  case 'think': {
    const t=el('div','th '+s.kind);
    t.appendChild(el('span','k',(ICON[s.kind]||'·')+' '+(KIND[s.kind]||'思考')));
    t.appendChild(el('p',null,fmt(s.text)));
    t.onclick=()=>t.classList.toggle('open');
    push('pThink', t, 'cThink', ++S.n.think);
    if(s.kind==='correct'){ S.n.fix++; narrate('⟲','軌道修正 — '+(s.head||'判断を組み直します'),'hit'); }
    refreshMetrics();
    return s.d || Math.min(6200, 1800+s.text.length*32);
  }

  case 'mile': {
    const m=el('div','mile');
    m.appendChild(el('span','mi','✓'));
    const b=el('div');
    b.appendChild(el('b',null,'達成'));
    b.appendChild(el('p',null,fmt(s.text)));
    m.appendChild(b);
    push('pThink', m, 'cThink', ++S.n.think);
    S.n.mile++; refreshMetrics();
    narrate('✓', s.narr||s.text.replace(/\*\*/g,''), 'good');
    return s.d || 3000;
  }

  case 'tool': {
    const t=el('div','tl running');
    const l1=el('div','l1');
    l1.appendChild(el('span','sp'));
    l1.appendChild(el('span','nm', esc(s.name)));
    l1.appendChild(el('span','st','実行中'));
    t.appendChild(l1);
    if(s.args) t.appendChild(el('div','ag', esc(s.args)));
    push('pTool', t, 'cTool', ++S.n.tool);
    refreshMetrics();
    S.pending=()=>{
      t.className='tl '+(s.status||'ok');
      const spn=l1.querySelector('.sp'); if(spn) spn.remove();
      l1.querySelector('.st').textContent =
        ({ok:'✓ ',warn:'⚠ ',err:'✕ '}[s.status||'ok'])+(s.ms||420)+'ms';
      if(s.result) t.appendChild(el('div','rs', fmt(s.result)));
      const mo=el('span','more','⋯'); mo.title='引数と全文';
      mo.onclick=e=>{e.stopPropagation(); t.classList.toggle('open');};
      l1.insertBefore(mo, l1.querySelector('.st'));
      $('pTool').scrollTop=$('pTool').scrollHeight;
    };
    return s.ms||420;
  }

  case 'par-open': {
    const c=el('div','par');
    c.appendChild(el('div','par-hd','<span class="sp"></span> 並列実行 — サブエージェント '+s.lanes.length+' 体'));
    const g=el('div','lanes');
    S.lanes=s.lanes.map(nm=>{const L=el('div','lane'); L.appendChild(el('h5',null,esc(nm))); g.appendChild(L); return L;});
    c.appendChild(g); push('pTool', c);
    narrate('⇉','3つの分析を並列で走らせています','');
    return 950;
  }
  case 'par-step': {
    showEvid('pTool');
    const L=S.lanes[s.lane];
    const li=el('div','li','<span class="sp"></span> '+esc(s.name));
    L.appendChild(li);
    S.pending=()=>{ li.className='li done';
      li.innerHTML='✓ <b>'+esc(s.name)+'</b><br>'+fmt(s.result);
      S.n.tool++; refreshMetrics(); $('pTool').scrollTop=$('pTool').scrollHeight; };
    return s.ms||420;
  }
  case 'par-close': { S.lanes=null; return 700; }

  case 'fact': {
    const f=el('div','ft '+(s.tone||''));
    f.appendChild(el('h6',null,esc(s.title)));
    f.appendChild(el('p',null,fmt(s.text)));
    push('pFact', f, 'cFact', ++S.n.fact);
    return s.d||1350;
  }
  case 'fact-revoke': {
    showEvid('pFact'); spotlight('panEvid');
    const ns=$('pFact').querySelectorAll('.ft');
    const n=ns[s.i<0?ns.length+s.i:s.i];
    if(n){ n.className='ft rev'; n.querySelector('h6').textContent='✗ '+n.querySelector('h6').textContent+'（棄却）'; }
    return 950;
  }

  case 'guard': {
    const ic={block:'🔒',warn:'⚠️',ok:'✅',info:'ℹ️'}[s.level]||'ℹ️';
    const g=el('div','gd '+s.level);
    g.appendChild(el('span','gi',ic));
    g.appendChild(el('span',null,fmt(s.text)));
    push('pGuard', g, 'cGuard', ++S.n.guard);
    if(s.level==='block'&&s.head) narrate('🔒','権限の壁 — '+s.head,'hit');
    return s.d||1900;
  }

  case 'await': {
    S.awaiting=s; setPhase('HUMAN');
    narrate('⏸', s.narr||'あなたの承認を待っています','wait');
    $('awaitTag').style.display='flex';
    $('awaitTxt').textContent=s.label||'Agent が確認を待っています';
    setCompose(s.reply,true); pause();
    requestAnimationFrame(()=>{ $('chatBody').scrollTop=$('chatBody').scrollHeight; });
    return 0;
  }
  }
  return 350;
}

/* ── タスクプラン ─────────────────────── */
function planOp(s){
  spotlight('panPlan');
  if(s.op==='set'){ $('pPlan').innerHTML=''; s.items.forEach(it=>addTask(it)); planCount(); return 1500; }
  if(s.op==='insert'){
    const node=addTask(s.item,true); node.classList.add('newly');
    const a=S.tasks.get(s.after); if(a) a.node.after(node);
    planCount(); return s.d||1200;
  }
  if(s.op==='status'){
    const t=S.tasks.get(s.id); if(!t) return 250;
    t.status=s.v;
    t.node.className='tk'+(t.sub?' sub':'')+' '+({running:'run',done:'done',warn:'warnst',fail:'fail',skip:'skip'}[s.v]||'');
    if(s.tag){ let g=t.node.querySelector('.tag'); if(!g){g=el('span','tag'); t.node.appendChild(g);} g.textContent=s.tag; }
    if(s.v==='running') t.node.scrollIntoView({block:'nearest',behavior:'smooth'});
    planCount(); return s.d||450;
  }
  if(s.op==='label'){ const t=S.tasks.get(s.id); if(t) t.node.querySelector('.lb').innerHTML=fmt(s.label); return 700; }
  return 250;
}
function addTask(it,noAppend){
  const node=el('div','tk'+(it.sub?' sub':''));
  node.appendChild(el('div','bx'));
  node.appendChild(el('div','lb', fmt(it.label)));
  S.tasks.set(it.id,{node,status:'',sub:!!it.sub});
  if(!noAppend) $('pPlan').appendChild(node);
  return node;
}

/* ── ループ制御 ───────────────────────── */
function tick(){
  if(!S.playing) return;
  if(S.pending){ const p=S.pending; S.pending=null; p(); S.timer=setTimeout(tick,540/S.speed); return; }
  if(S.idx>=S.steps.length){ pause(); return; }
  const d=exec(S.steps[S.idx++])||350;
  S.n.ms+=d; refreshMetrics();
  if(!S.playing) return;
  S.timer=setTimeout(tick, d/S.speed);
}
function stepOnce(){
  if(S.pending){ const p=S.pending; S.pending=null; p(); return; }
  if(S.idx>=S.steps.length) return;
  S.n.ms+=exec(S.steps[S.idx++])||350; refreshMetrics();
}
function play(){
  if(S.awaiting){ sendCompose(); return; }
  if(S.idx>=S.steps.length) return;
  S.playing=true; tick();
}
function pause(){ S.playing=false; clearTimeout(S.timer); }

/* ── 入力欄 ───────────────────────────── */
function setCompose(text,armed){
  const c=$('cbox');
  if(text){ c.textContent=text; c.classList.remove('empty'); }
  else { c.textContent='Agent が処理中です…'; c.classList.add('empty'); }
  c.classList.toggle('armed',!!armed);
  $('bSend').disabled=!armed;
}
function sendCompose(){
  if($('bSend').disabled) return;
  const txt=$('cbox').textContent;
  const m=el('div','msg user');
  m.appendChild(el('div','ic','You')); m.appendChild(el('div','bub',fmt(txt)));
  push('chatBody', m);
  $('awaitTag').style.display='none'; setCompose(null,false);
  if(S.awaiting&&S.awaiting.type==='await'){ S.n.hum++; refreshMetrics(); }
  S.awaiting=null; play();
}

/* ── 起動・切替 ───────────────────────── */
function loadScenario(key){
  if(S) pause();
  const scn=SCENARIOS[key];
  S=newState(scn);
  document.querySelectorAll('#tabs .tab').forEach(b=>b.classList.toggle('on', b.dataset.k===key));
  ['chatBody','pPlan','pThink','pTool','pFact','pGuard'].forEach(id=>$(id).innerHTML='');
  $('pPlan').appendChild(el('div','empty-note','依頼を送信すると<br>Agent がタスクを分解します'));
  $('pThink').appendChild(el('div','empty-note','Agent の内部推論と達成ポイント'));
  $('pTool').appendChild(el('div','empty-note','外部システムへのアクセス履歴'));
  $('pFact').appendChild(el('div','empty-note','確定した事実'));
  $('pGuard').appendChild(el('div','empty-note','権限境界と安全制御'));
  ['cPlan','cThink','cTool','cFact','cGuard'].forEach(id=>$(id).textContent = id==='cPlan'?'0/0':'0');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('hot'));
  showEvid('pTool');
  $('agName').textContent=scn.agent;
  $('agSub').textContent='待機中';
  setPhase(null);
  narrate('⏸','待機中','');
  S.awaiting={type:'await'}; S.n.hum=-1;
  $('awaitTag').style.display='none';
  setCompose(scn.prompt,true);
  refreshMetrics();
}

function boot(){
  Object.entries(SCENARIOS).forEach(([k,v])=>{
    const b=el('button','tab',v.tab); b.dataset.k=k; b.onclick=()=>loadScenario(k); $('tabs').appendChild(b);
  });
  document.querySelectorAll('.evtab').forEach(b=>b.onclick=()=>showEvid(b.dataset.p));
  $('bSend').onclick=sendCompose;
  /* 画面上にコントロールは出さない。プレゼン中はキーボードで操作する。 */
  document.addEventListener('keydown',e=>{
    if(e.target.isContentEditable) return;
    if(e.code==='Space'){ e.preventDefault(); S.playing?pause():play(); }
    else if(e.code==='ArrowRight'){ e.preventDefault(); pause(); S.awaiting?sendCompose():stepOnce(); }
    else if(e.key==='r'||e.key==='R'){ loadScenario(document.querySelector('#tabs .tab.on').dataset.k); }
    else if(e.key==='s'||e.key==='S'){
      S.speed=SPEEDS[(SPEEDS.indexOf(S.speed)+1)%SPEEDS.length];
      narrate('⚙','再生速度 '+S.speed+'×','');
    }
  });
  loadScenario(Object.keys(SCENARIOS)[0]);
}
/* ══════════════════════════════════════════════════════════
